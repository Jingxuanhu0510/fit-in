<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>Fit In - Interactive Body Rite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&family=Instrument+Serif:ital@0;1&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#050505;--text:#e0e0e0;--muted:rgba(224,224,224,.4);--accent:#ff6a5e;--blue:#8ed8ff;--green:#8bd6ad;--line:rgba(224,224,224,.12);--serif:'Instrument Serif',serif;--mono:'IBM Plex Mono',monospace;--cn:'Noto Serif SC',serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--mono)}canvas{position:fixed;inset:0;width:100vw;height:100vh;z-index:1;transition:opacity 2s ease}video{display:none}.hud{position:fixed;inset:0;z-index:10;pointer-events:none;display:flex;flex-direction:column;padding:40px;transition:opacity 1s ease}.hidden{opacity:0;pointer-events:none}.top-bar{display:flex;justify-content:space-between;font-size:10px;letter-spacing:2px;color:var(--muted);margin-bottom:auto}.exhibit{border:1px solid var(--line);padding:4px 12px}.main-content{display:flex;justify-content:space-between;align-items:flex-end;height:80%}.left-panel{display:flex;flex-direction:column;gap:20px}.gesture-icon-box{width:200px;height:260px;border:1px solid var(--line);background:rgba(255,255,255,.02);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:15px;position:relative}.gesture-label{position:absolute;bottom:10px;font-size:9px;color:var(--accent);letter-spacing:2px;text-transform:uppercase}.bottom-left{margin-top:auto}.title-main{font-family:var(--serif);font-style:italic;font-size:clamp(24px,4vw,50px);line-height:1;margin:0;text-transform:uppercase}.right-panel{width:220px;text-align:right}.pct-main{font-family:var(--serif);font-style:italic;font-size:80px;line-height:.8;margin-bottom:20px}.stats{display:flex;flex-direction:column;gap:12px}.stat-row{display:flex;flex-direction:column;gap:4px}.stat-meta{display:flex;justify-content:space-between;font-size:8px;color:var(--muted);letter-spacing:1px}.stat-bar{height:1px;background:var(--line);overflow:hidden}.stat-fill{height:100%;background:var(--text);width:0%;transition:width .4s ease}.start{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}.start h1{font-family:var(--serif);font-style:italic;font-size:clamp(80px,15vw,150px);margin:0;line-height:.9}.start p{font-family:var(--cn);font-size:24px;letter-spacing:15px;color:var(--muted);margin:20px 0 60px;font-weight:400}.start-btn{padding:15px 50px;border:1px solid var(--line);background:none;color:var(--text);font-family:var(--serif);font-size:20px;font-style:italic;cursor:pointer;transition:.3s}.start-btn:hover{background:var(--text);color:var(--bg)}.final{position:fixed;inset:0;z-index:200;background:#fff;display:none;place-items:center;opacity:0;transition:opacity 3s ease,background 3s ease}.final.show{opacity:1;display:grid}.final-card{text-align:center;padding:40px;mix-blend-mode:difference;color:#fff}.final-card h2{font-family:var(--cn);font-size:40px;margin:0;font-weight:600;letter-spacing:2px;line-height:1.4}.final-card p{font-size:14px;letter-spacing:4px;text-transform:uppercase;margin-top:20px;opacity:.8}.flash{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:50;opacity:0;pointer-events:none;transition:.4s}.flash.show{opacity:1}.flash-inner{border:1px solid var(--green);color:var(--green);padding:8px 20px;font-size:12px;background:rgba(0,0,0,.9);letter-spacing:4px}
</style>
</head>
<body>
<canvas id="stage"></canvas><video id="webcam" autoplay playsinline muted></video>
<div class="start" id="screen-start"><div style="font-size:10px;letter-spacing:4px;margin-bottom:10px;opacity:.5">BIO-SENSORY FEED / 2026</div><h1>Fit In</h1><p>迎合</p><button class="start-btn" id="btn-init">Initialize Census</button></div>
<div class="hud hidden" id="hud"><div class="top-bar"><div>BIO-METRIC MONITOR v.8.5</div><div class="exhibit" id="exhibit-id">EXHIBIT N°701</div></div><div class="main-content"><div class="left-panel"><div class="gesture-icon-box" id="gesture-icon-container"><div id="gesture-icon"></div><div class="gesture-label" id="gesture-label">GESTURE 01</div></div></div><div class="bottom-left"><h1 class="title-main" id="title-main">System Calibrating...</h1></div><div class="right-panel"><div class="pct-main" id="hold-pct">0%</div><div class="stats"><div class="stat-row"><div class="stat-meta"><span>ASSIMILATION / 同化</span><span id="val-assim">0%</span></div><div class="stat-bar"><div class="stat-fill" id="bar-assim" style="background:var(--blue)"></div></div></div><div class="stat-row"><div class="stat-meta"><span>SELFHOOD / 自我</span><span id="val-self">100%</span></div><div class="stat-bar"><div class="stat-fill" id="bar-self" style="background:var(--accent);width:100%"></div></div></div><div class="stat-row"><div class="stat-meta"><span>SKIP TIMER / 跳过</span><span id="val-timer">15s</span></div><div class="stat-bar"><div class="stat-fill" id="bar-timer" style="background:var(--muted)"></div></div></div></div></div></div></div>
<div class="flash" id="flash"><div class="flash-inner">SYSTEM MATCHED</div></div>
<div class="final" id="screen-final"><div class="final-card"><h2 id="final-title">You are yourself / 你就是你自己</h2><p id="final-meta">Fragmentation Aborted</p><button class="start-btn" style="margin-top:50px;font-size:16px;border-color:#fff;color:#fff" onclick="location.reload()">Restart</button></div></div>
<script type="module">
import{PoseLandmarker,HandLandmarker,FilesetResolver}from"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0";
const SKIP_LIMIT=15,MATCH_THRESHOLD=.14,MAX_EYES=5,$=id=>document.getElementById(id),canvas=$('stage'),ctx=canvas.getContext('2d'),video=$('webcam');let W,H,dpr=window.devicePixelRatio||1,phase='INIT',results=null,handResults=null,poseLandmarker=null,handLandmarker=null,lastVideoTime=-1,currentRound=0,holdVal=0,skipTimer=SKIP_LIMIT,assimilation=0,selfhood=100,everAssimilated=false,hasEngaged=false,attachedGlitches=[],watchingEyes=[],finalStartTime=0;
function resize(){W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
const bodyIcon='<path d="M50 20 C35 20 25 35 25 55 C25 75 40 95 50 95 C60 95 75 75 75 55 C75 35 65 20 50 20" fill="none" stroke="currentColor" stroke-width="1.5"/><ellipse cx="50" cy="52" rx="14" ry="18" fill="none" stroke="currentColor" stroke-dasharray="2 2"/>';const redH=(x,y,w,h)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="var(--accent)" opacity="0.9" rx="2"/>`;
const GESTURES=[{id:'01',name:'SIDE COVER (R)',joint:'right_wrist',isLeft:false,target:p=>({x:p.nose.x+.14,y:p.nose.y}),icon:bodyIcon+redH(72,25,14,55)},{id:'02',name:'SIDE COVER (L)',joint:'left_wrist',isLeft:true,target:p=>({x:p.nose.x-.14,y:p.nose.y}),icon:bodyIcon+redH(14,25,14,55)},{id:'03',name:'MOUTH COVER (R)',joint:'right_wrist',isLeft:false,target:p=>({x:p.nose.x,y:p.nose.y+.14}),icon:bodyIcon+redH(22,65,56,14)},{id:'04',name:'MOUTH COVER (L)',joint:'left_wrist',isLeft:true,target:p=>({x:p.nose.x,y:p.nose.y+.14}),icon:bodyIcon+redH(22,65,56,14)},{id:'05',name:'T-POSE INTERSECT',joint:'right_wrist',isLeft:false,target:p=>({x:p.nose.x,y:p.nose.y+.12}),secondJoint:'left_wrist',isSecondLeft:true,secondTarget:p=>({x:p.nose.x-.16,y:p.nose.y+.12}),icon:bodyIcon+redH(22,65,56,12)+redH(43,45,12,50)},{id:'06',name:'BOTH VERTICAL SEAL',joint:'right_wrist',isLeft:false,target:p=>({x:p.nose.x+.05,y:p.nose.y+.16}),secondJoint:'left_wrist',isSecondLeft:true,secondTarget:p=>({x:p.nose.x-.05,y:p.nose.y+.16}),icon:bodyIcon+redH(38,60,10,40)+redH(52,60,10,40)},{id:'07',name:'HEART PLEDGE',joint:'right_wrist',isLeft:false,target:p=>({x:p.chest.x+.05,y:p.chest.y+.05}),icon:bodyIcon+`<rect x="35" y="78" width="30" height="22" fill="var(--accent)" opacity="0.85" rx="4"/>`},{id:'08',name:'FINAL CROSS',joint:'right_wrist',isLeft:false,target:p=>({x:p.chest.x,y:p.chest.y-.12}),secondJoint:'left_wrist',isSecondLeft:true,secondTarget:p=>({x:p.chest.x,y:p.chest.y-.12}),isCross:true,icon:bodyIcon+`<g transform="translate(50,85)"><rect x="-28" y="-6" width="56" height="12" fill="var(--accent)" opacity="0.85" transform="rotate(40)"/><rect x="-28" y="-6" width="56" height="12" fill="var(--accent)" opacity="0.85" transform="rotate(-40)"/></g>`}];
async function init(){try{const vision=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0/wasm');poseLandmarker=await PoseLandmarker.createFromOptions(vision,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task',delegate:'GPU'},runningMode:'VIDEO',numPoses:1});handLandmarker=await HandLandmarker.createFromOptions(vision,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',delegate:'GPU'},runningMode:'VIDEO',numHands:2})}catch(e){console.warn(e);alert('MediaPipe failed to load. Please use Live Server and check network.')} $('btn-init').onclick=start;resize();addEventListener('resize',resize)}
async function start(){try{$('screen-start').classList.add('hidden');$('hud').classList.remove('hidden');const stream=await navigator.mediaDevices.getUserMedia({video:{width:1280,height:720}});video.srcObject=stream;await video.play();phase='CALIB';requestAnimationFrame(loop)}catch(e){console.warn(e);$('screen-start').classList.remove('hidden');$('hud').classList.add('hidden');alert('Camera permission denied. Please allow camera access in the browser.')}}
function getRawPose(lms){if(!lms)return null;const map={nose:0,ls:11,rs:12,le:13,re:14,lw:15,rw:16},p={};for(const k in map){const pt=lms[map[k]];if(pt)p[k]={x:1-pt.x,y:pt.y,vis:pt.visibility}}if(!p.nose||!p.ls||!p.rs)return null;return{...p,chest:{x:(p.ls.x+p.rs.x)/2,y:(p.ls.y+p.rs.y)/2}}}
function getHandPos(pose,isLeft){if(handResults?.landmarks&&handResults?.handednesses){for(let i=0;i<handResults.landmarks.length;i++){const isActualLeft=handResults.handednesses[i][0].categoryName==='Right';if(isLeft===isActualLeft)return{x:1-handResults.landmarks[i][0].x,y:handResults.landmarks[i][0].y}}}return isLeft?pose.lw:pose.rw}
const FILTER_POOL=['contrast(1.5) brightness(1.1)','invert(1) grayscale(1)','hue-rotate(90deg) contrast(1.2)','sepia(0.8) brightness(0.9)','grayscale(1) brightness(1.4)','saturate(3) contrast(1.1)'];
function loop(ts){if(phase==='END_FADE'){renderFinal();return}if(video.currentTime!==lastVideoTime&&poseLandmarker&&handLandmarker){results=poseLandmarker.detectForVideo(video,ts);handResults=handLandmarker.detectForVideo(video,ts);lastVideoTime=video.currentTime}ctx.fillStyle='#050505';ctx.fillRect(0,0,W,H);ctx.save();ctx.translate(W,0);ctx.scale(-1,1);ctx.globalAlpha=.25+assimilation/300;ctx.drawImage(video,0,0,W,H);ctx.restore();const raw=results?.landmarks?.[0]?getRawPose(results.landmarks[0]):null;if(raw){drawSkel(raw,holdVal>.5);if(phase==='CALIB'){holdVal+=.025;const prg=Math.min(1,holdVal);$('hold-pct').innerText=Math.round(prg*100)+'%';if(prg>=1){phase='PLAY';holdVal=0;updateRound()}}else if(phase==='PLAY'){const g=GESTURES[currentRound],target=g.target(raw),hand=getHandPos(raw,g.isLeft);let isMatching=false;if(hand&&hand.x!==undefined){isMatching=Math.hypot(hand.x-target.x,hand.y-target.y)<MATCH_THRESHOLD;if(g.secondJoint){const t2=g.secondTarget(raw),h2=getHandPos(raw,g.isSecondLeft);if(h2){isMatching=isMatching&&Math.hypot(h2.x-t2.x,h2.y-t2.y)<MATCH_THRESHOLD;if(g.isCross)isMatching=isMatching&&Math.hypot(hand.x-h2.x,hand.y-h2.y)<.1}else isMatching=false}if(isMatching){holdVal+=.008;assimilation=Math.min(100,assimilation+.08);selfhood=Math.max(0,selfhood-.05);everAssimilated=true;hasEngaged=true;if(Math.random()<.12)spawnGlitch(raw)}else{holdVal=Math.max(0,holdVal-.003);selfhood=Math.min(100,selfhood+.02)}}drawTarget(target.x*W,target.y*H,isMatching);if(g.secondJoint){const t2=g.secondTarget(raw);drawTarget(t2.x*W,t2.y*H,isMatching)}if(holdVal>=1)nextRound();skipTimer-=.016;if(skipTimer<=0)nextRound();updateHUD()}}renderAttachedGlitches(raw);renderWatchingEyes(raw?.nose,ts);requestAnimationFrame(loop)}
function spawnGlitch(raw){const js=['nose','chest','ls','rs'],joint=js[Math.floor(Math.random()*js.length)],type=currentRound<3?0:(Math.random()>.5?0:3);attachedGlitches.push({joint,off:{dx:(Math.random()-.5)*.25,dy:(Math.random()-.5)*.25},sz:40+Math.random()*60,type,rot:Math.random()*.2-.1,filter:FILTER_POOL[Math.floor(Math.random()*FILTER_POOL.length)]});if(attachedGlitches.length>35)attachedGlitches.shift()}
function renderAttachedGlitches(raw){if(!raw)return;attachedGlitches.forEach(g=>{const pt=raw[g.joint];if(!pt)return;const dx=(pt.x+g.off.dx)*W,dy=(pt.y+g.off.dy)*H;ctx.save();ctx.filter=g.filter;ctx.translate(dx,dy);ctx.rotate(g.rot);ctx.beginPath();if(g.type===0)ctx.rect(-g.sz/2,-g.sz/2,g.sz,g.sz);else ctx.rect(-W*.3,-g.sz/8,W*.6,g.sz/4);ctx.clip();ctx.translate(-dx,-dy);ctx.translate(W,0);ctx.scale(-1,1);ctx.drawImage(video,0,0,video.videoWidth,video.videoHeight,0,0,W,H);ctx.restore();ctx.strokeStyle='rgba(255,255,255,.15)';ctx.lineWidth=1;if(g.type===0)ctx.strokeRect(dx-g.sz/2,dy-g.sz/2,g.sz,g.sz);else ctx.strokeRect(dx-W*.3,dy-g.sz/8,W*.6,g.sz/4)})}
function renderWatchingEyes(nose,ts){if(Math.random()<.005&&watchingEyes.length<MAX_EYES){let ex=Math.random()*W,ey=Math.random()*H;if(ex>W*.3&&ex<W*.7)ex=ex>W/2?W*.85:W*.15;if(ey>H*.3&&ey<H*.7)ey=ey>H/2?H*.85:H*.15;watchingEyes.push({x:ex,y:ey,r:15+Math.random()*15,blinkSeed:Math.random()*10000})}watchingEyes.forEach(e=>{const time=ts+e.blinkSeed;let blink=1;if(time%6000<400)blink=1-Math.abs(Math.sin(time%6000/400*Math.PI));ctx.save();ctx.translate(e.x,e.y);ctx.scale(1,Math.max(.05,blink));ctx.translate(-e.x,-e.y);ctx.strokeStyle='rgba(255,255,255,.18)';ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,7);ctx.stroke();const ang=nose?Math.atan2(nose.y*H-e.y,nose.x*W-e.x):0;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(e.x+Math.cos(ang)*e.r*.4,e.y+Math.sin(ang)*e.r*.4,e.r*.18,0,7);ctx.fill();ctx.restore()})}
function renderFinal(){ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);ctx.save();ctx.translate(W,0);ctx.scale(-1,1);ctx.globalAlpha=Math.min(1,(Date.now()-finalStartTime)/4000);ctx.drawImage(video,0,0,W,H);ctx.restore();requestAnimationFrame(renderFinal)}
function finish(){phase='END_FADE';finalStartTime=Date.now();$('hud').classList.add('hidden');$('screen-final').classList.add('show');if(!hasEngaged||assimilation<8){$('final-title').innerHTML='You are yourself<br>你就是你自己';$('final-meta').innerText='INDIVIDUALITY RESTORED'}else{const score=Math.round(assimilation);$('final-title').innerHTML=score>55?'QUALIFIED / 判定合格':'UNQUALIFIED / 判定不合格';$('final-meta').innerText=`Compliance Index: ${score}%`}}
function updateRound(){holdVal=0;skipTimer=SKIP_LIMIT;$('title-main').innerText=GESTURES[currentRound].name;$('exhibit-id').innerText=`EXHIBIT N°70${currentRound+1}`;$('gesture-label').innerText=`GESTURE 0${currentRound+1}`;$('gesture-icon').innerHTML=`<svg viewBox="0 0 100 120" width="100%" height="100%" style="color:var(--text);">${GESTURES[currentRound].icon}</svg>`}
function nextRound(){currentRound++;if(currentRound>=GESTURES.length)finish();else updateRound()}
function drawSkel(p,ok){ctx.strokeStyle=ok?'#8bd6ad':'rgba(255,255,255,.12)';ctx.lineWidth=2.5;[['nose','ls'],['nose','rs'],['ls','le'],['le','lw'],['rs','re'],['re','rw'],['ls','rs']].forEach(([a,b])=>{if(p[a]&&p[b]){ctx.beginPath();ctx.moveTo(p[a].x*W,p[a].y*H);ctx.lineTo(p[b].x*W,p[b].y*H);ctx.stroke()}})}
function drawTarget(tx,ty,ok){ctx.strokeStyle=ok?'#8bd6ad':'#ff6a5e';ctx.lineWidth=1;ctx.setLineDash([5,5]);ctx.beginPath();ctx.arc(tx,ty,MATCH_THRESHOLD*W,0,7);ctx.stroke();ctx.setLineDash([]);if(ok){ctx.beginPath();ctx.arc(tx,ty,MATCH_THRESHOLD*W+6,-1.57,-1.57+holdVal*6.28);ctx.stroke()}}
function updateHUD(){$('hold-pct').innerText=Math.round(holdVal*100)+'%';$('val-assim').innerText=Math.round(assimilation)+'%';$('bar-assim').style.width=assimilation+'%';$('val-self').innerText=Math.round(selfhood)+'%';$('bar-self').style.width=selfhood+'%';$('val-timer').innerText=Math.ceil(skipTimer)+'s';$('bar-timer').style.width=skipTimer/SKIP_LIMIT*100+'%'}
init();
</script>
</body>
</html>
