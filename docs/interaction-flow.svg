<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#130b12"/><g font-family="Segoe UI,Microsoft YaHei,sans-serif" fill="#f3d9ad"><text x="64" y="80" font-size="44">FIT IN / 合身</text><text x="64" y="120" font-size="18">交互流程 · HYBRID EDITION</text><rect x="64" y="176" width="336" height="208" fill="#201016" stroke="#b99182"/><text x="88" y="216" font-size="15" fill="#e98aa5">01 / ENTER</text><text x="88" y="268" font-size="30">选择入口</text><text x="88" y="316" font-size="17">鼠标演示 / 摄像头互动</text><rect x="432" y="176" width="336" height="208" fill="#201016" stroke="#b99182"/><text x="456" y="216" font-size="15" fill="#e98aa5">02 / CALIBRATE</text><text x="456" y="268" font-size="30">自然站立</text><text x="456" y="316" font-size="17">摄像头读取上半身基线</text><rect x="800" y="176" width="336" height="208" fill="#201016" stroke="#b99182"/><text x="824" y="216" font-size="15" fill="#e98aa5">03 / FOLLOW</text><text x="824" y="268" font-size="30">移动手部</text><text x="824" y="316" font-size="17">跟随目标圆圈与动作提示</text><rect x="64" y="424" width="336" height="208" fill="#201016" stroke="#b99182"/><text x="88" y="464" font-size="15" fill="#e98aa5">04 / HOLD</text><text x="88" y="516" font-size="30">稳定保持</text><text x="88" y="564" font-size="17">命中且稳定，累计保持进度</text><rect x="432" y="424" width="336" height="208" fill="#201016" stroke="#b99182"/><text x="456" y="464" font-size="15" fill="#e98aa5">05 / DECIDE</text><text x="456" y="516" font-size="30">服从或拒绝</text><text x="456" y="564" font-size="17">完成动作 / 等待 22 秒超时</text><rect x="800" y="424" width="336" height="208" fill="#201016" stroke="#b99182"/><text x="824" y="464" font-size="15" fill="#e98aa5">06 / RESULT</text><text x="824" y="516" font-size="30">查看结果</text><text x="824" y="564" font-size="17">七轮后呈现同化与自我指标</text><text x="64" y="708" font-size="18">鼠标模式跳过校准。摄像头丢失身体时暂停计时，重新入镜后继续。</text></g></svg>