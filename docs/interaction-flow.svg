<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760"><rect width="1200" height="760" fill="#050505"/><g font-family="Microsoft YaHei,Segoe UI,sans-serif" fill="#e0e0e0"><text x="64" y="80" font-size="44">FIT IN / 迎合</text><text x="64" y="120" font-size="18">摄像头互动 · 八组动作</text><rect x="64" y="176" width="336" height="208" fill="#111" stroke="#555"/><text x="88" y="216" font-size="15" fill="#ff6a5e">01 / START</text><text x="88" y="268" font-size="30">开启摄像头</text><text x="88" y="316" font-size="16">Initialize Census → 允许摄像头</text><rect x="432" y="176" width="336" height="208" fill="#111" stroke="#555"/><text x="456" y="216" font-size="15" fill="#ff6a5e">02 / CALIBRATE</text><text x="456" y="268" font-size="30">完整入镜</text><text x="456" y="316" font-size="16">等待 System Calibrating 完成</text><rect x="800" y="176" width="336" height="208" fill="#111" stroke="#555"/><text x="824" y="216" font-size="15" fill="#ff6a5e">03 / MATCH</text><text x="824" y="268" font-size="30">跟随动作</text><text x="824" y="316" font-size="16">单手或双手移至目标圈</text><rect x="64" y="424" width="336" height="208" fill="#111" stroke="#555"/><text x="88" y="464" font-size="15" fill="#ff6a5e">04 / HOLD</text><text x="88" y="516" font-size="30">持续保持</text><text x="88" y="564" font-size="16">绿色命中 → 保持进度增加</text><rect x="432" y="424" width="336" height="208" fill="#111" stroke="#555"/><text x="456" y="464" font-size="15" fill="#ff6a5e">05 / NEXT</text><text x="456" y="516" font-size="30">进入下一轮</text><text x="456" y="564" font-size="16">达到 100% 或跳过计时耗尽</text><rect x="800" y="424" width="336" height="208" fill="#111" stroke="#555"/><text x="824" y="464" font-size="15" fill="#ff6a5e">06 / RESULT</text><text x="824" y="516" font-size="30">八轮结算</text><text x="824" y="564" font-size="16">查看结果 → Restart 重新开始</text></g></svg>